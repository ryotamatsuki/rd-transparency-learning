name: Verify symbolic R&D results

on:
  push:
    paths:
      - "code/**"
      - "requirements.txt"
      - ".github/workflows/verify-symbolic.yml"
  pull_request:
    paths:
      - "code/**"
      - "requirements.txt"
      - ".github/workflows/verify-symbolic.yml"
  workflow_dispatch:

jobs:
  symbolic-proof:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install requirements
        run: python -m pip install -r requirements.txt
      - name: Run exact symbolic inequality checks and benchmark
        run: python code/finite_cost_proof.py | tee symbolic-proof-run.log
      - name: Independently check hidden benchmark finite deviations (numerical only)
        run: python code/independent_payoff_audit.py
      - name: Independent Stage 4A exact algebra, globality and finite deviations
        run: python code/stage4a_independent_audit.py | tee stage4a-independent-run.log
      - name: Upload stdout for independent audit
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: symbolic-proof-output
          path: |
            symbolic-proof-run.log
            stage4a-independent-run.log
            stage4a_independent_numerical_results.json
          if-no-files-found: ignore
